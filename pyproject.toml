[project]
name = "voice-assistant"
version = "0.1.0"
description = "Local voice assistant with push-to-talk and Whisper transcription"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "faster-whisper",
    "sounddevice",
    "numpy",
    "evdev",
    "PySide6-Essentials",
    "kokoro-onnx",
    "onnxruntime",
]

[dependency-groups]
dev = ["pytest"]

[project.scripts]
voice-assistant = "voice_assistant:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
# tools/ holds manual scripts named test_*.py that type into the focused window.
testpaths = ["tests"]
