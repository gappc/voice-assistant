[project]
name = "voice-assistant"
version = "0.1.0"
description = "Local voice assistant with push-to-talk and Parakeet transcription"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "sounddevice",
    "numpy",
    "PySide6-Essentials",
    "kokoro-onnx",
    "onnxruntime",
    "jeepney>=0.9.0",
]

[dependency-groups]
dev = [
    "evdev>=1.9.3",
    "pytest",
]

[project.scripts]
voice-assistant = "voice_assistant:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
# Only tests/: tools/ holds manual scripts, not tests.
testpaths = ["tests"]
